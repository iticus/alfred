[build-system]
build-backend = "uv_build"
requires = [ "uv-build" ]

[project]
name = "alfred"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "iticus", email = "ticus.ionut@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp==3.14.5",
  "aiohttp-jinja2==1.6",
  "aiohttp-session==2.12.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "jinja2==3.1.6",
  "py-vapid==1.9.6",
  "python-dotenv==1.2.4",
  "pywebpush==2.5.0",
  "redis==8.1.0",
]
scripts.alfred = "alfred:main"

[dependency-groups]
dev = [
  "deptry==0.25.1",
  "prek==0.5.7",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "ty==0.0.95",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages.find.where = [ "src" ]

[tool.uv]
default-groups = [ "dev" ]
sources.alfred = { path = ".", editable = true }
package = true

[tool.ruff]
line-length = 120
indent-width = 4
src = [ "src", "tests" ]
cache-dir = ".cache/.ruff_cache"
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # missing-trailing-comma
  "D203",   # incorrect-blank-line-before-class
  "D213",   # multi-line-summary-first-line
]
lint.per-file-ignores."{tests}/**" = [
  "S101", # assertions
]

[tool.deptry]
known_first_party = [ "alfred" ]

[tool.ty]
src.include = [ "src", "tests" ]
src.exclude = [ "src/alfred/hardware/esp8266" ]

[tool.pytest]
ini_options.pythonpath = "src"
ini_options.addopts = [
  "--import-mode=importlib",
  "--pythonwarnings=error",
]
ini_options.asyncio_mode = "auto"
ini_options.log_cli = true
ini_options.log_cli_level = "INFO"
ini_options.log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
